<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e7">
  <title>记账本</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="todayLabel">今天</p>
        <h1>记账本</h1>
      </div>
      <button class="icon-button" id="quickExpenseBtn" type="button" aria-label="快速记支出" title="快速记支出">+</button>
    </header>

    <main>
      <section class="view active" id="homeView" data-view="home" aria-labelledby="homeTitle">
        <h2 id="homeTitle" class="sr-only">首页</h2>
        <div class="metric-grid">
          <article class="metric primary">
            <span>今日支出</span>
            <strong id="todayExpense">0.00</strong>
          </article>
          <article class="metric">
            <span>预算剩余</span>
            <strong id="budgetLeft">0.00</strong>
          </article>
          <article class="metric wide">
            <span>总余额</span>
            <strong id="totalBalance">0.00</strong>
          </article>
        </div>

        <div class="action-row">
          <button class="pill-button" type="button" data-new-type="expense">记支出</button>
          <button class="pill-button" type="button" data-new-type="income">记收入</button>
          <button class="pill-button" type="button" data-new-type="transfer">记转账</button>
        </div>

        <section class="section-block">
          <div class="section-head">
            <h3>最近流水</h3>
            <button class="text-button" type="button" data-nav-target="records">全部</button>
          </div>
          <div id="recentList" class="record-list empty-host"></div>
        </section>
      </section>

      <section class="view" id="entryView" data-view="entry" aria-labelledby="entryTitle">
        <div class="section-head">
          <h2 id="entryTitle">记一笔</h2>
          <button class="text-button" type="button" id="clearEntryBtn">清空</button>
        </div>

        <div class="segmented" role="tablist" aria-label="流水类型">
          <button class="active" type="button" data-entry-type="expense">支出</button>
          <button type="button" data-entry-type="income">收入</button>
          <button type="button" data-entry-type="transfer">转账</button>
        </div>

        <form id="entryForm" class="form-panel">
          <input type="hidden" id="editingId">
          <label>
            <span>金额</span>
            <input id="amountInput" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required>
          </label>

          <div id="singleAccountFields">
            <label>
              <span>账户</span>
              <select id="accountSelect"></select>
            </label>
          </div>

          <div id="transferFields" class="hidden">
            <label>
              <span>转出账户</span>
              <select id="fromAccountSelect"></select>
            </label>
            <label>
              <span>转入账户</span>
              <select id="toAccountSelect"></select>
            </label>
          </div>

          <label id="categoryField">
            <span>分类</span>
            <select id="categorySelect"></select>
          </label>

          <label>
            <span>日期</span>
            <input id="dateInput" type="date" required>
          </label>

          <label id="specialField" class="switch-row">
            <span>
              <b>特殊账单</b>
              <small>房租、人情、大额支出等</small>
            </span>
            <input id="specialInput" type="checkbox">
          </label>

          <label>
            <span>备注</span>
            <textarea id="noteInput" rows="3" placeholder="可写具体用途"></textarea>
          </label>

          <button class="submit-button" type="submit" id="saveEntryBtn">保存</button>
        </form>
      </section>

      <section class="view" id="recordsView" data-view="records" aria-labelledby="recordsTitle">
        <div class="section-head">
          <h2 id="recordsTitle">流水</h2>
          <button class="text-button" type="button" id="resetFiltersBtn">重置</button>
        </div>

        <div class="filters">
          <input id="filterMonth" type="month" aria-label="月份筛选">
          <select id="filterAccount" aria-label="账户筛选"></select>
          <select id="filterType" aria-label="类型筛选">
            <option value="">全部类型</option>
            <option value="expense">支出</option>
            <option value="income">收入</option>
            <option value="transfer">转账</option>
          </select>
          <select id="filterCategory" aria-label="分类筛选"></select>
          <select id="filterSpecial" aria-label="特殊账单筛选">
            <option value="">特殊账单</option>
            <option value="true">仅特殊</option>
            <option value="false">非特殊</option>
          </select>
        </div>

        <div id="recordsList" class="record-list empty-host"></div>
      </section>

      <section class="view" id="statsView" data-view="stats" aria-labelledby="statsTitle">
        <h2 id="statsTitle">统计</h2>
        <div class="stats-grid">
          <article>
            <span>本月支出</span>
            <strong id="monthExpense">0.00</strong>
          </article>
          <article>
            <span>本月预算</span>
            <strong id="monthBudget">0.00</strong>
          </article>
          <article>
            <span>特殊账单</span>
            <strong id="specialTotal">0.00</strong>
          </article>
          <article>
            <span>大额支出</span>
            <strong id="largeCount">0</strong>
          </article>
        </div>

        <section class="section-block">
          <h3>分类占比</h3>
          <div id="categoryStats" class="bar-list empty-host"></div>
        </section>

        <section class="section-block">
          <div class="section-head">
            <h3>每日趋势</h3>
            <div class="trend-mode" aria-label="每日趋势显示模式">
              <button class="active" type="button" data-trend-mode="amount">金额</button>
              <button type="button" data-trend-mode="composition">金额+占比</button>
            </div>
          </div>
          <div id="dailyTrend" class="trend-panel empty-host"></div>
        </section>

        <section class="section-block">
          <h3>账户余额</h3>
          <div id="accountBalances" class="balance-list"></div>
        </section>

        <section class="section-block">
          <h3>大额支出</h3>
          <div id="largeExpenseList" class="record-list compact empty-host"></div>
        </section>

        <section class="section-block">
          <h3>特殊账单列表</h3>
          <div id="specialList" class="record-list compact empty-host"></div>
        </section>
      </section>

      <section class="view" id="settingsView" data-view="settings" aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">设置</h2>

        <section class="section-block">
          <div class="section-head">
            <h3>本月预算</h3>
            <button class="text-button" type="button" id="saveBudgetBtn">保存</button>
          </div>
          <label class="inline-field">
            <span>预算金额</span>
            <input id="budgetInput" type="number" inputmode="decimal" min="0" step="0.01">
          </label>
        </section>

        <section class="section-block">
          <div class="section-head">
            <h3>账户管理</h3>
            <button class="text-button" type="button" id="addAccountBtn">新增</button>
          </div>
          <div id="accountSettings" class="account-settings"></div>
        </section>

        <section class="section-block">
          <h3>数据备份</h3>
          <div class="backup-actions">
            <button class="pill-button" type="button" id="exportBtn">导出 CSV</button>
            <label class="pill-button file-button">
              导入 CSV
              <input id="importInput" type="file" accept=".csv,text/csv" multiple>
            </label>
          </div>
          <p class="hint">导入会覆盖当前本地数据。建议先导出备份。</p>
        </section>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="active" type="button" data-nav-target="home">首页</button>
      <button type="button" data-nav-target="records">流水</button>
      <button type="button" data-nav-target="entry">记账</button>
      <button type="button" data-nav-target="stats">统计</button>
      <button type="button" data-nav-target="settings">设置</button>
    </nav>
  </div>

  <dialog id="setupDialog" class="modal">
    <form method="dialog" id="setupForm">
      <h2>初始化账户</h2>
      <p>先填入当前余额，之后 App 会根据流水自动计算余额。</p>
      <div id="setupAccounts" class="setup-list"></div>
      <label>
        <span>本月预算</span>
        <input id="setupBudget" type="number" inputmode="decimal" min="0" step="0.01" placeholder="例如 3000">
      </label>
      <button class="submit-button" value="default">开始使用</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
